org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
# Kept on the legacy plugin path because some plugins (e.g. file_picker 8.x)
# still apply kotlin-android, which is incompatible with Built-in Kotlin under
# AGP 9. The legacy path triggers a Kotlin incremental-cache bug on Windows;
# we mitigate it by disabling the Kotlin incremental compiler in build.gradle.kts.
android.builtInKotlin=false
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.jvm=false
